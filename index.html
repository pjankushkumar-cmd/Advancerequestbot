<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latest Issue</title>
<style>html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif}#latest{padding:12px;font-size:20px;font-weight:700;color:#000}</style>
</head>
<body>
<div id="latest"></div>
<script>
async function load(){
  try{
    const r=await fetch('/api/latest?t='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    document.getElementById('latest').textContent=d.issue||'';
  }catch(e){console.log(e)}
}
load();setInterval(load,1000);
</script>
</body>
</html>
